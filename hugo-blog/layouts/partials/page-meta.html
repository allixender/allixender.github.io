{{/* page-meta.html */}}
{{ if .Date }}<div class="page-meta">
	<p>Updated {% if .Params.modified %}<time datetime="{{ .Params.modified | time.Format "2006-01-02T15:04:05Z" }}" itemprop="dateModified">{{ .Params.modified | time.Format "January 02, 2006" }}</time>{% else %}<time datetime="{{ .Date.Format "2006-01-02T15:04:05Z" }}" itemprop="datePublished">{{ .Date.Format "January 02, 2006" }}</time></p>{% endif %}
</div><!-- /.page-meta -->{{ end }}
