<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>{{ if .Title }}{{ .Title }} • {{ else }}{{ site.Title }}{{ end }}</title>
    {{ if .Description }}<meta name="description" content="{{ .Description }}">{{ end }}
    {{ if .Params.tags }}<meta name="keywords" content="{{ delimit .Params.tags ", " }}">{{ end }}
    
    <link rel="canonical" href="{{ .Permalink }}">
    
    <link href="{{ .Site.BaseURL }}index.xml" type="application/atom+xml" rel="alternate" title="{{ .Site.Title }} Atom Feed">
    <link href="{{ .Site.BaseURL }}sitemap.xml" type="application/xml" rel="sitemap" title="Sitemap">
    
    <meta name="HandheldFriendly" content="True">
    <meta name="MobileOptimized" content="320">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="cleartype" content="on">
    
    <link rel="stylesheet" href="{{ .Site.BaseURL }}css/main.css">
    
    <!-- HTML5 Shiv and Media Query Support for IE -->
    <!--[if lt IE 9]>
      <script src="{{ .Site.BaseURL }}js/vendor/html5shiv.min.js"></script>
      <script src="{{ .Site.BaseURL }}js/vendor/respond.min.js"></script>
    <![endif]-->
    
      <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-64696949-1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      
      gtag('config', 'UA-64696949-1');
    </script>
  
  </head>
  
  <body id="js-body">
    {{ partial "browser-upgrade.html" . }}
    {{ partial "header.html" . }}
    {{ partial "navigation-sliding.html" . }}
    
    <div id="page-wrapper">
      {{ block "main" . }}{{ end }}
      {{ partial "footer.html" . }}
    </div>
    
    <script src="{{ .Site.BaseURL }}js/vendor/jquery-1.9.1.min.js"></script>
    <script src="{{ .Site.BaseURL }}js/main.js"></script>
  
  </body>
  
</html>
